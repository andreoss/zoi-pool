# The pool itself uses reflection in one place only: loading a JDBC driver named
# in the configuration. Register that driver in the image, or leave
# `driverClassName` unset and let the URL find it.
#
# The management bean is reachable through JMX, which is reflective, so its
# interface is registered in reflect-config.json. An image built without JMX can
# drop it by leaving `jmxEnabled` off.
Args = --initialize-at-run-time=zoi.pool.ConnectionFactory
